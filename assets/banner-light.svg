<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Vinod Atwal - Senior Software Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <radialGradient id="c1" cx="0.30" cy="0.20" r="0.6">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#67e8f9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="c2" cx="0.72" cy="0.12" r="0.55">
      <stop offset="0" stop-color="#c4b5fd" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#c4b5fd" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="c3" cx="0.88" cy="0.90" r="0.65">
      <stop offset="0" stop-color="#f9a8d4" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#f9a8d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="c4" cx="0.12" cy="0.88" r="0.55">
      <stop offset="0" stop-color="#86efac" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#86efac" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <linearGradient id="text" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(255,255,255,0.70)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0.35)"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(255,255,255,0.65)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>

  <g filter="url(#blur)">
    <rect width="1200" height="360" fill="url(#c1)"/>
    <rect width="1200" height="360" fill="url(#c2)"/>
    <rect width="1200" height="360" fill="url(#c3)"/>
    <rect width="1200" height="360" fill="url(#c4)"/>
  </g>

  <rect x="36" y="40" width="1128" height="280" rx="28" fill="url(#panel)" stroke="rgba(15,23,42,0.15)" stroke-width="1.5"/>
  <rect x="36" y="40" width="1128" height="150" rx="28" fill="url(#sheen)"/>

  <text x="80" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="700" fill="url(#text)" letter-spacing="0.5">Vinod Atwal</text>
  <text x="80" y="216" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="23" fill="#3b4a6b">Senior Software Engineer - Software Supply-Chain Security &amp; Identity Platforms</text>
  <text x="80" y="256" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#64748b" letter-spacing="2">JAVA  ·  GO  ·  PKI  ·  IAM  ·  AWS  ·  KUBERNETES</text>
</svg>