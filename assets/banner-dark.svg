<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Vinod Atwal - Senior Software Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060a16"/>
      <stop offset="1" stop-color="#0e1530"/>
    </linearGradient>
    <radialGradient id="c1" cx="0.30" cy="0.20" r="0.6">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="c2" cx="0.72" cy="0.12" r="0.55">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.80"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="c3" cx="0.88" cy="0.90" r="0.65">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.60"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="c4" cx="0.12" cy="0.88" r="0.55">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <linearGradient id="text" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ccd6ff"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(255,255,255,0.11)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0.03)"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(255,255,255,0.14)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>

  <g filter="url(#blur)">
    <rect width="1200" height="360" fill="url(#c1)"/>
    <rect width="1200" height="360" fill="url(#c2)"/>
    <rect width="1200" height="360" fill="url(#c3)"/>
    <rect width="1200" height="360" fill="url(#c4)"/>
  </g>

  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <path d="M60 0 V360 M180 0 V360 M300 0 V360 M420 0 V360 M540 0 V360 M660 0 V360 M780 0 V360 M900 0 V360 M1020 0 V360 M1140 0 V360"/>
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200"/>
  </g>

  <rect x="36" y="40" width="1128" height="280" rx="28" fill="url(#panel)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
  <rect x="36" y="40" width="1128" height="150" rx="28" fill="url(#sheen)"/>

  <text x="80" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="700" fill="url(#text)" letter-spacing="0.5">Vinod Atwal</text>
  <text x="80" y="216" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="23" fill="#a9b6dd">Senior Software Engineer - Software Supply-Chain Security &amp; Identity Platforms</text>
  <text x="80" y="256" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#7f8dbb" letter-spacing="2">JAVA  ·  GO  ·  PKI  ·  IAM  ·  AWS  ·  KUBERNETES</text>
</svg>