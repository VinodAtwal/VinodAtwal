<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 · Vinod Atwal</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="./favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="./styles.css" />
<script>
  document.documentElement.setAttribute("data-theme", "dark");
  document.documentElement.classList.add("js");
</script>
</head>
<body>
<main id="main" style="padding-top:14vh">
  <div class="term window">
    <div class="term-bar">
      <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="term-title">404 — route not found</span>
    </div>
    <div class="term-body">
      <p class="term-cmd"><span class="prompt">$</span> curl -I <span class="flag">--location</span> /this-page</p>
      <p class="term-out"><span class="prompt">&gt;</span> HTTP/2 404</p>
      <p class="term-note">No such route. The path doesn't resolve, or something moved it.</p>
      <p style="margin-top:14px"><a class="btn primary" href="./"><span aria-hidden="true">$</span> cd ~</a></p>
    </div>
  </div>
</main>
</body>
</html>
